name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: composer lint
      - name: Analyse
        run: composer analyse

  tests:
    name: tests (${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sunrice
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sunrice
          POSTGRES_PASSWORD: sunrice
          POSTGRES_DB: sunrice
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U sunrice" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql, gd, intl
          coverage: none

      - name: Configure the database
        run: |
          case "${{ matrix.db }}" in
            sqlite) echo "DB_CONNECTION=sqlite" >> $GITHUB_ENV; echo "DB_DATABASE=:memory:" >> $GITHUB_ENV ;;
            mysql)  printf 'DB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=sunrice\nDB_USERNAME=root\nDB_PASSWORD=root\n' >> $GITHUB_ENV ;;
            pgsql)  printf 'DB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=sunrice\nDB_USERNAME=sunrice\nDB_PASSWORD=sunrice\n' >> $GITHUB_ENV ;;
          esac

      - run: composer install --no-interaction --prefer-dist
      - name: Test
        run: composer test
