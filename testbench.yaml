# The workbench app for `composer serve`: the panel and the CMS together.
# Sign in at /_workbench/login/admin@example.com.
laravel: '@testbench'

providers:
  - Sunrice\Admin\AdminServiceProvider
  - Sunrice\Cms\CmsServiceProvider
  - Spatie\Honeypot\HoneypotServiceProvider
  - Spatie\ResponseCache\ResponseCacheServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

env:
  - AUTH_MODEL=Workbench\App\Models\User
  - APP_URL=http://127.0.0.1:8000
  - SUNRICE_LOCALES=en,id
  # The database cache store on the workbench's SQLite file by name: on a first build the file
  # doesn't exist yet when the app boots, so Testbench boots on its in-memory `testing` connection
  # and the cache store (resolved at boot by RateLimiter::for) would stay on it, without the
  # cache table the migrations create in the file ("no such table: cache").
  - DB_CACHE_CONNECTION=sqlite

workbench:
  start: /admin
  user: admin@example.com
  install: true
  auth: true
  discovers:
    web: false
    api: false
    commands: false
    views: false
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - db-seed:
        --class: Workbench\Database\Seeders\DatabaseSeeder
    - sunrice:assets
    - vendor:publish:
        --tag: sunrice-cms-assets
        --force: true
    - storage:link
